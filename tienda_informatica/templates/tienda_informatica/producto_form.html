{% extends "base.html" %}
{% block title %}{{ accion }} producto{% endblock %}
{% block content %}
<h1>{{ accion }} de producto</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Guardar</button>
    <a class="btn small" href="{% url 'ti_producto_list' %}">Cancelar</a>
</form>
{% endblock %}
