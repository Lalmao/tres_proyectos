{% extends "base.html" %}
{% block title %}Baja de viaje{% endblock %}
{% block content %}
<h1>Baja de viaje</h1>
<p>¿Confirmas eliminar el viaje <strong>{{ viaje.codigo }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn danger" type="submit">Sí, eliminar</button>
    <a class="btn small" href="{% url 'av_viaje_list' %}">Cancelar</a>
</form>
{% endblock %}
