{% extends "base.html" %}
{% block title %}{{ accion }} proyecto{% endblock %}
{% block content %}
<h1>{{ accion }} de proyecto</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

</form>
{% endblock %}
