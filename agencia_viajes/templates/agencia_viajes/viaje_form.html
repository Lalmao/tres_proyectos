{% extends "base.html" %}
{% block title %}{{ accion }} viaje{% endblock %}
{% block content %}
<h1>{{ accion }} de viaje</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Guardar</button>
    <a class="btn small" href="{% url 'av_viaje_list' %}">Cancelar</a>
</form>
{% endblock %}
